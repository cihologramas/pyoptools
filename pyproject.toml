[build-system]
requires = [
    "setuptools>=70",
    "setuptools_scm>=8",
    "wheel",
    "Cython==3.0.11",
    "eigency",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptools"
dynamic = ["version"]
description = "Python tools for simulation of optical systems"
authors = [{ name = "Ricardo Amézquita Orozco", email = "ramezquitao@cihologramas.com" }]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.2",
    "scipy>=1.5.2",
    "imageio>=2.9.0",
    "PyYAML>=5.3.1",
    "matplotlib>=3.3.1",
    "orjson>=3.10.7",
    "Pillow>=10.0.1",
    "importlib-resources>=3.3.0",
    "plotly>=5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0"
]

[tool.setuptools]
packages = { find = { exclude = ["tests*", "doc*", "debian*"] } }

[tool.setuptools.package-data]
"pyoptools.raytrace.mat_lib" = [
    "data/glass/*",
    "data/glass/*/*",
    "data/glass/*/*/*",
    "data/inorganic/*",
    "data/inorganic/*/*",
    "data/organic/*",
    "data/organic/*/*",
    "data/organic/*/*",
    "data/aliases.json"
]
"pyoptools.raytrace.library" = ["catalogs/*"]


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-timestamp"

[tool.cython]
directive = {language_level = "3"}

[tool.cython-lint]
max-line-length = 88
ignore = ["E741"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "linting: Python and Cython linting test",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "*.pyx",
    "*.pxd",
    "build",
    "dist",
    "doc",
    "debian",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length (matching existing repo policy)
]

[tool.ruff.lint.per-file-ignores]
"**/all.py" = ["F403", "F405"]
"**/gs.py" = ["F403", "F405"]
"**/__init__.py" = ["F401", "F403"]
"**/comp_lib.py" = ["F401"]
"tests/**" = ["E402", "F401", "F403", "F405"]

[dependency-groups]
dev = [
    "cython-lint>=0.18.0",
    "ruff>=0.8.0",
    "setuptools>=80.9.0",
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
]
